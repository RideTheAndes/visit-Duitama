name: Check Facts
on:
  pull_request:
    branches:
      - main
jobs:
  check-facts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Run facts check
        run: node tools/check-facts.mjs --ci

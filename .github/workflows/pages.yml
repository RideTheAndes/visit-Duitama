# Publica la carpeta sitio/ en GitHub Pages (visitduitama.com).
# Solo sitio/: las exploraciones de la landing y los documentos no se publican.
name: Publicar sitio

on:
  push:
    branches: [main, piloto-gfbm]
    paths: ['sitio/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
